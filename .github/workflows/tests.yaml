name: Tests
permissions:
  contents: read
"on":
  pull_request: {}
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      # Offline tests, including idp_test.go. TestSaaSAPIServerIDIsDerivedWithoutOptions
      # fails if New() no longer registers the IdP hook, i.e. if
      # .speakeasy/patches/authlete.go.patch was not applied after a regeneration.
      # The live tests in ./tests run in the Integration Tests workflow.
      - run: go test $(go list ./... | grep -v /tests)
      - name: gofmt
        run: test -z "$(gofmt -l idp.go idp_test.go internal/hooks/idprouting.go)"
